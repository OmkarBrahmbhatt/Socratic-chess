<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Socratic Chess</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">A study space for chess</p>
      <h1>Socratic Chess</h1>
      <p class="intro">Practice positions at your level, one thoughtful move at a time.</p>

      {% if error %}
        <p class="message error" role="alert">{{ error }}</p>
      {% elif rating is not none %}
        <p class="message success" role="status">
          Rating received: {{ rating }}. Your practice set is the next step.
        </p>
      {% endif %}

      <form method="post">
        <label for="rating">What is your chess rating?</label>
        <div class="form-row">
          <input
            id="rating"
            name="rating"
            type="number"
            min="0"
            step="1"
            value="{{ rating if rating is not none else '' }}"
            required
          >
          <button type="submit">Continue</button>
        </div>
      </form>
    </main>
  </body>
</html>
